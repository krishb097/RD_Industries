<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD - Industries | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0a0c10; --bg-card: #12161f; --surface-border: rgba(255, 255, 255, 0.08); --silver-primary: #e2e8f0; --font-heading: 'Orbitron', sans-serif; --font-body: 'Plus Jakarta Sans', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        body { background: var(--bg-primary); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--surface-border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 400px; }
        .form-control { width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.3); border: 1px solid var(--surface-border); border-radius: 10px; color: #fff; margin-top: 0.4rem; }
        .btn { width: 100%; padding: 0.8rem; background: var(--silver-primary); color: #000; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 style="font-family: var(--font-heading); text-align: center; margin-bottom: 1.5rem;">User Login</h2>
        <form onsubmit="handleLogin(event)">
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; color: #94a3b8;">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" required>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; color: #94a3b8;">Password</label>
                <input type="password" id="loginPass" class="form-control" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <p style="text-align: center; font-size: 0.85rem; margin-top: 1rem; color: #94a3b8;">Don't have an account? <a href="signup.html" style="color: #38bdf8;">Sign Up</a></p>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            const users = JSON.parse(localStorage.getItem('rd_registered_users')) || [];
            const user = users.find(u => u.email === email && u.password === pass);

            if(user) {
                localStorage.setItem('rd_active_user', JSON.stringify(user));
                alert('Login Successful!');
                window.location.href = 'index.html';
            } else {
                alert('Invalid Credentials!');
            }
        }
    </script>
</body>
</html>
